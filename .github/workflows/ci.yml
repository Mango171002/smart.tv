name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Also called by the production deploy (deploy-cloudflare.yml, job « ci »): deployed only when this passes.
  workflow_call:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Test what is built: `npm run build` reads .env.production, so the E2E suite expects the same released languages
      # and content-pages mode (absent from .env.production → empty → English-only production expectations).
      - name: E2E expectations from .env.production
        run: |
          get() { sed -n "s/^$1=//p" .env.production | tail -n 1 | tr -d '\r"' | xargs; }
          echo "E2E_RELEASED=$(get NEXT_PUBLIC_RELEASED_LANGUAGES)" >> "$GITHUB_ENV"
          echo "E2E_CONTENT_PAGES=$(get NEXT_PUBLIC_CONTENT_PAGES)" >> "$GITHUB_ENV"
      # No Supabase credentials in CI: the site falls back to the static illustrative tables.
      - run: npm run test:e2e

  cloudflare-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds the Cloudflare Worker bundle (no deployment, no credentials needed).
      - run: npx opennextjs-cloudflare build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash supabase/tests/run-local.sh
