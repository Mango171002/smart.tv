# Deploys the site to Cloudflare Workers (OpenNext).
# Secrets of the GitHub Environment « production » (not repository secrets — docs/release/final/a13-ci-hardening.md):
#   CLOUDFLARE_API_TOKEN (user or account-owned token: Workers Scripts Edit on the account + Workers Routes Edit
#   on the zone sygmatv.com), BREVO_API_KEY, TELEGRAM_BOT_TOKEN, SUPABASE_SECRET_KEY.
# Live URL: https://sygmatv.com
# Hardening (A13, security report D13-003/004/005):
# - the whole CI (.github/workflows/ci.yml: lint, typecheck, unit, build, E2E, Cloudflare bundle, database) must pass
#   first (job « ci », reusable workflow) — nothing is deployed otherwise;
# - the Cloudflare token is given only to the steps that call Cloudflare (env: on the step), never via $GITHUB_ENV;
# - dependencies are installed with --ignore-scripts (no install script runs next to secrets);
# - third-party actions are pinned to full commit SHAs;
# - the job runs in the GitHub Environment « production » (auto-created on the first run if it does not exist; the
#   owner adds deployment-branch rules and moves the secrets there — docs/release/final/a13-ci-hardening.md).
name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: ['claude/intelligent-shannon-uwa4fi']

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  ci:
    # The full CI on the same commit, required before the production deploy (D13-005).
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Defence in depth on top of the environment's branch rule: a manual run from any other branch never deploys.
    if: github.ref == 'refs/heads/claude/intelligent-shannon-uwa4fi'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 9a7bb862febedb1b8e70a005037adee5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify the Cloudflare token (not exported to later steps)
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Cloudflare token for THIS step only (never written to $GITHUB_ENV): bare token, stray spaces / line
          # breaks, or the whole « curl … -H 'Authorization: Bearer <token>' » snippet shown by Cloudflare.
          if printf '%s' "$RAW_TOKEN" | grep -q 'Bearer'; then
            CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr '\n' ' ' | sed -E 's/.*Bearer[[:space:]]+([A-Za-z0-9_.-]+).*/\1/')"
          else
            CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Account-owned tokens (Manage account → API tokens) are verified on the account endpoint, user tokens
          # (My profile → API tokens) on the user endpoint: try the account one first, then the user one.
          status="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
          [ "$status" = "200" ] || status="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          if [ "$status" != "200" ]; then
            echo "::error::Cloudflare rejected the token (HTTP $status). Re-create the CLOUDFLARE_API_TOKEN secret with only the token value."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # No install script: esbuild / workerd resolve their prebuilt platform packages without their postinstall.
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: IndexNow — snapshot of the live public pages (before deploy)
        continue-on-error: true
        run: node scripts/indexnow.mjs snapshot --out "$RUNNER_TEMP/indexnow-before.json"
      - name: Build and deploy
        id: deploy
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Cloudflare token for THIS step only (never written to $GITHUB_ENV): bare token, stray spaces / line
          # breaks, or the whole « curl … -H 'Authorization: Bearer <token>' » snippet shown by Cloudflare.
          if printf '%s' "$RAW_TOKEN" | grep -q 'Bearer'; then
            CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr '\n' ' ' | sed -E 's/.*Bearer[[:space:]]+([A-Za-z0-9_.-]+).*/\1/')"
          else
            CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN
          npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
      - name: Customer e-mails (Brevo) — API key
        env:
          BREVO_KEY: ${{ secrets.BREVO_API_KEY }}
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Cloudflare token for THIS step only (never written to $GITHUB_ENV): bare token, stray spaces / line
          # breaks, or the whole « curl … -H 'Authorization: Bearer <token>' » snippet shown by Cloudflare.
          if printf '%s' "$RAW_TOKEN" | grep -q 'Bearer'; then
            CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr '\n' ' ' | sed -E 's/.*Bearer[[:space:]]+([A-Za-z0-9_.-]+).*/\1/')"
          else
            CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN
          # Optional: customer e-mails stay off until the BREVO_API_KEY secret exists in GitHub.
          if [ -z "$BREVO_KEY" ]; then echo "::notice::No BREVO_API_KEY secret: customer e-mails are not sent yet."; exit 0; fi
          BREVO_KEY="$(printf '%s' "$BREVO_KEY" | tr -d '[:space:]')"
          echo "::add-mask::$BREVO_KEY"
          printf '%s' "$BREVO_KEY" | npx wrangler secret put BREVO_API_KEY >/dev/null && echo "BREVO_API_KEY set."
      - name: Operations bot (Telegram) — secrets and webhook
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SB_SECRET: ${{ secrets.SUPABASE_SECRET_KEY }}
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Cloudflare token for THIS step only (never written to $GITHUB_ENV): bare token, stray spaces / line
          # breaks, or the whole « curl … -H 'Authorization: Bearer <token>' » snippet shown by Cloudflare.
          if printf '%s' "$RAW_TOKEN" | grep -q 'Bearer'; then
            CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr '\n' ' ' | sed -E 's/.*Bearer[[:space:]]+([A-Za-z0-9_.-]+).*/\1/')"
          else
            CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN
          # Optional: skipped until the TELEGRAM_BOT_TOKEN secret exists in GitHub.
          if [ -z "$TG_TOKEN" ]; then echo "No TELEGRAM_BOT_TOKEN secret: bot not configured."; exit 0; fi
          TG_TOKEN="$(printf '%s' "$TG_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$TG_TOKEN"
          printf '%s' "$TG_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN >/dev/null
          if [ -n "$SB_SECRET" ]; then
            SB_SECRET="$(printf '%s' "$SB_SECRET" | tr -d '[:space:]')"
            echo "::add-mask::$SB_SECRET"
            printf '%s' "$SB_SECRET" | npx wrangler secret put SUPABASE_SECRET_KEY >/dev/null
          else
            echo "::warning::Add the SUPABASE_SECRET_KEY secret so the bot can read and update requests."
          fi
          HOOK_SECRET="$(TG_TOKEN="$TG_TOKEN" node -e "const c=require('crypto');process.stdout.write(c.createHash('sha256').update(process.env.TG_TOKEN+':sygma-ops-webhook').digest('hex').slice(0,48))")"
          echo "::add-mask::$HOOK_SECRET"
          node -e "process.stdout.write(JSON.stringify({url:'https://sygmatv.com/api/telegram/webhook',secret_token:process.argv[1],allowed_updates:['message','callback_query'],drop_pending_updates:false}))" "$HOOK_SECRET" > hook.json
          curl -fsS -X POST -H 'content-type: application/json' --data @hook.json "https://api.telegram.org/bot$TG_TOKEN/setWebhook" | grep -q '"ok":true' && echo "Webhook registered."
          rm -f hook.json
          cat > cmds.json <<'JSON'
          {"commands":[{"command":"id","description":"Mon identifiant Telegram"},{"command":"attente","description":"Demandes en attente"},{"command":"stats","description":"Activité des dernières 24 h"},{"command":"setup","description":"Enregistrer ce sujet (admins)"},{"command":"testemail","description":"E-mails de test (essai, essai-actif, suivi…) vers support@"},{"command":"actualiser","description":"Actualiser les fiches en cours (admins)"},{"command":"aide","description":"Aide"}]}
          JSON
          curl -fsS -X POST -H 'content-type: application/json' --data @cmds.json "https://api.telegram.org/bot$TG_TOKEN/setMyCommands" >/dev/null && echo "Commands set."
          rm -f cmds.json
      - name: Smoke test
        run: |
          sleep 10
          curl -fsS https://sygmatv.com/api/health
          curl -fsS -o /dev/null -w "%{http_code}\n" https://sygmatv.com/
      - name: Lighthouse audit of the live site (mobile + desktop)
        run: |
          set -o pipefail
          U=https://sygmatv.com/
          npm i --no-save lighthouse@13.6.0 >/dev/null 2>&1
          # 3 runs per profile, the median run is kept (shared runners are noisy).
          for preset in mobile desktop; do
            extra=""; [ "$preset" = desktop ] && extra="--preset=desktop"
            for i in 1 2 3; do
              npx lighthouse "$U" --quiet $extra --chrome-flags="--headless=new --no-sandbox" \
                --output=json --output-path="lh-$preset-$i.json"
            done
          done
          node - <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          let failed = false;
          console.log('Median of 3 runs per profile.\n');
          console.log('| Profile | Performance | Accessibility | Best practices | SEO* | LCP | CLS |');
          console.log('|---|---|---|---|---|---|---|');
          for (const p of ['mobile', 'desktop']) {
            const runs = [1, 2, 3].map((i) => JSON.parse(fs.readFileSync(`lh-${p}-${i}.json`, 'utf8')))
              .sort((a, b) => a.categories.performance.score - b.categories.performance.score);
            const r = runs[1]; // median performance run
            const s = (k) => Math.round(r.categories[k].score * 100);
            // GitHub runners are slower and noisier than real devices: mobile performance gate at 80.
            const min = { performance: p === 'mobile' ? 80 : 90, accessibility: 90, 'best-practices': 90 };
            for (const k of Object.keys(min)) if (s(k) < min[k]) failed = true;
            console.log(`| ${p} | ${s('performance')} | ${s('accessibility')} | ${s('best-practices')} | ${s('seo')} | ${r.audits['largest-contentful-paint'].displayValue} | ${r.audits['cumulative-layout-shift'].displayValue} |`);
          }
          console.log('\n*SEO is capped while the prototype is served with `noindex` on purpose.');
          if (failed) { console.log('\n**A score dropped below its threshold.**'); process.exitCode = 1; }
          NODE
      - name: IndexNow — notify search engines of changed public pages
        # Runs last (the new version is live everywhere by now) and never fails the deployment.
        # Dry run until the repository variable INDEXNOW_ENABLED is set to "true".
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        env:
          INDEXNOW_ENABLED: ${{ vars.INDEXNOW_ENABLED }}
        run: |
          SEND=""; [ "$INDEXNOW_ENABLED" = "true" ] && SEND="--send"
          node scripts/indexnow.mjs changed --before "$RUNNER_TEMP/indexnow-before.json" $SEND
