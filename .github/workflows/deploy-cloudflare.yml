# Deploys the site to Cloudflare Workers (OpenNext).
# Requires ONE repository secret that you create in GitHub:
#   CLOUDFLARE_API_TOKEN  (Cloudflare token with the "Edit Cloudflare Workers" permissions)
# Live URL: https://sygmatv.com
name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: ['claude/intelligent-shannon-uwa4fi', 'main']

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 9a7bb862febedb1b8e70a005037adee5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and verify the Cloudflare token
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Accept a bare token, a token with stray spaces/line breaks, or the whole
          # "curl ... -H 'Authorization: Bearer <token>'" snippet shown by Cloudflare.
          if printf '%s' "$RAW_TOKEN" | grep -q 'Bearer'; then
            T="$(printf '%s' "$RAW_TOKEN" | tr '\n' ' ' | sed -E 's/.*Bearer[[:space:]]+([A-Za-z0-9_.-]+).*/\1/')"
          else
            T="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          fi
          if [ -z "$T" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "::add-mask::$T"
          status="$(curl -s -o verify.json -w '%{http_code}' -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          if [ "$status" != "200" ]; then
            echo "::error::Cloudflare rejected the token (HTTP $status). Re-create the CLOUDFLARE_API_TOKEN secret with only the token value."
            exit 1
          fi
          rm -f verify.json
          echo "CLOUDFLARE_API_TOKEN=$T" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and deploy
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
      - name: Smoke test
        run: |
          sleep 10
          curl -fsS https://sygmatv.com/api/health
          curl -fsS -o /dev/null -w "%{http_code}\n" https://sygmatv.com/en
      - name: Lighthouse audit of the live site (mobile + desktop)
        run: |
          set -o pipefail
          U=https://sygmatv.com/en
          npm i --no-save lighthouse@13.6.0 >/dev/null 2>&1
          for preset in mobile desktop; do
            extra=""; [ "$preset" = desktop ] && extra="--preset=desktop"
            npx lighthouse "$U" --quiet $extra --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output-path="lh-$preset.json"
          done
          node - <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          let failed = false;
          console.log('| Profile | Performance | Accessibility | Best practices | SEO* | LCP | CLS |');
          console.log('|---|---|---|---|---|---|---|');
          for (const p of ['mobile', 'desktop']) {
            const r = JSON.parse(fs.readFileSync(`lh-${p}.json`, 'utf8'));
            const s = (k) => Math.round(r.categories[k].score * 100);
            // GitHub runners are slower and noisier than real devices: mobile performance gate at 80.
            const min = { performance: p === 'mobile' ? 80 : 90, accessibility: 90, 'best-practices': 90 };
            for (const k of Object.keys(min)) if (s(k) < min[k]) failed = true;
            console.log(`| ${p} | ${s('performance')} | ${s('accessibility')} | ${s('best-practices')} | ${s('seo')} | ${r.audits['largest-contentful-paint'].displayValue} | ${r.audits['cumulative-layout-shift'].displayValue} |`);
          }
          console.log('\n*SEO is capped while the prototype is served with `noindex` on purpose.');
          if (failed) { console.log('\n**A score dropped below its threshold.**'); process.exitCode = 1; }
          NODE
