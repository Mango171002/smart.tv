# OPTIONAL alternative to Cloudflare "Workers Builds" (Git integration in the dashboard).
# Manual only. Requires two repository secrets that YOU create:
#   CLOUDFLARE_API_TOKEN  (template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
name: Deploy to Cloudflare (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and deploy
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
