# PRIVATE STAGING — deploys the Worker « sygma-staging » on https://staging.sygmatv.com (Cloudflare Access).
# Runs ONLY on a push to the branch claude/staging-deploy. Never touches the production Worker
# (« iptv-international »), its secrets, its cron, the Telegram webhook or IndexNow.
# Prerequisite (owner, once): a Cloudflare Access application for staging.sygmatv.com (see docs/release/staging.md).
# Hardening (A13): Cloudflare token only on the steps that call Cloudflare, npm ci --ignore-scripts, actions pinned
# by commit SHA, GitHub Environment « staging » (auto-created on the first run; the owner gives staging its own token).
name: Deploy private staging

on:
  push:
    branches: ['claude/staging-deploy']

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: 9a7bb862febedb1b8e70a005037adee5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the Cloudflare token is present (not exported to later steps)
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Cloudflare token for THIS step only (never written to $GITHUB_ENV): bare token, stray spaces / line
          # breaks, or the whole « curl … -H 'Authorization: Bearer <token>' » snippet shown by Cloudflare.
          if printf '%s' "$RAW_TOKEN" | grep -q 'Bearer'; then
            CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr '\n' ' ' | sed -E 's/.*Bearer[[:space:]]+([A-Za-z0-9_.-]+).*/\1/')"
          else
            CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN secret missing."; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Staging settings safety checks
        run: |
          grep -qx 'NEXT_PUBLIC_ALLOW_INDEXING=false' .env.staging || { echo "::error::staging must not be indexable"; exit 1; }
          grep -qx 'FEATURE_CONTACT_FORM=false' .env.staging || { echo "::error::contact form must be off"; exit 1; }
          ! grep -q '^NEXT_PUBLIC_RELEASED_LANGUAGES' .env.staging || { echo "::error::no language release on staging"; exit 1; }
          grep -q '"name": "sygma-staging"' wrangler.staging.jsonc || { echo "::error::wrong Worker name"; exit 1; }
          ! grep -q 'iptv-international' wrangler.staging.jsonc || { echo "::error::production Worker name found"; exit 1; }
      - name: Cloudflare Access must already protect the hostname (otherwise nothing is deployed)
        run: |
          # Without a login, Access answers with a redirect to the Cloudflare Access login page (or 401/403).
          for path in / /api/health /fr; do
            out="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://staging.sygmatv.com$path")"
            echo "Before deploy, unauthenticated $path → $out"
            case "$out" in
              30[1237]\ https://*.cloudflareaccess.com/*|401\ *|403\ *) ;;
              *) echo "::error::Access is not protecting staging.sygmatv.com$path — nothing deployed."; exit 1 ;;
            esac
          done
      # Unit tests run on the repository as committed (they check that production files never enable a preview).
      - run: npm test
      - name: Apply the staging build settings (runner only, after the tests)
        run: cp .env.staging .env.production
      - name: Build and deploy the staging Worker
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Cloudflare token for THIS step only (never written to $GITHUB_ENV): bare token, stray spaces / line
          # breaks, or the whole « curl … -H 'Authorization: Bearer <token>' » snippet shown by Cloudflare.
          if printf '%s' "$RAW_TOKEN" | grep -q 'Bearer'; then
            CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr '\n' ' ' | sed -E 's/.*Bearer[[:space:]]+([A-Za-z0-9_.-]+).*/\1/')"
          else
            CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN
          npx opennextjs-cloudflare build --config wrangler.staging.jsonc && npx opennextjs-cloudflare deploy --config wrangler.staging.jsonc
      - name: Access protection check (takes staging down if it is public)
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Cloudflare token for THIS step only (never written to $GITHUB_ENV): bare token, stray spaces / line
          # breaks, or the whole « curl … -H 'Authorization: Bearer <token>' » snippet shown by Cloudflare.
          if printf '%s' "$RAW_TOKEN" | grep -q 'Bearer'; then
            CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr '\n' ' ' | sed -E 's/.*Bearer[[:space:]]+([A-Za-z0-9_.-]+).*/\1/')"
          else
            CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          export CLOUDFLARE_API_TOKEN
          sleep 15
          code="$(curl -s -o /dev/null -w '%{http_code}' https://staging.sygmatv.com/)"
          echo "Unauthenticated request → HTTP $code"
          if [ "$code" = "200" ]; then
            echo "::error::staging.sygmatv.com answers without Cloudflare Access — deleting the staging Worker."
            npx wrangler delete --config wrangler.staging.jsonc --force
            exit 1
          fi
